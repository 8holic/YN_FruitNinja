<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Fruit Ninja — Skeleton</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <canvas id="game"></canvas>
    <div id="flash"></div>
    <div id="hud">
      <div class="hud-top"><span id="time">60</span><span id="score">0</span></div>
      <div id="combo-meter">
        <div id="combo-track"><div id="combo-fill"></div></div>
        <span id="combo-label">x1</span>
      </div>
    </div>
    <div id="overlay">
      <span class="start-title">Slice to start</span>
      <img id="start-pumpkin" src="assets/images/medpoint.png" alt="pumpkin">
      <small>
        Slash pumpkins <img src="assets/images/medpoint.png" alt="pumpkin"> and candy <img src="assets/images/highpoint.png" alt="candy"> — avoid the skulls <img src="assets/images/minuspoint.png" alt="skull">!<br>
        Every 10 slices raises your multiplier, up to ×5.<br>
        Keep slicing to hold your combo — skulls cost points and drop it a level.
      </small>
    </div>

    <div id="board" class="hidden">
      <div class="panel">
        <div class="board-title">Time!</div>
        <div class="board-score">Score <span id="final-score">0</span></div>
        <form id="score-form">
          <input id="player-name" type="text" maxlength="16" placeholder="Your name" autocomplete="nickname">
          <button id="submit-score" type="submit">Submit</button>
        </form>
        <p id="board-status"></p>
        <ol id="scores"></ol>
        <div id="you" class="hidden">
          <span id="you-rank">-</span>
          <span>You</span>
          <span id="you-score">0</span>
        </div>
        <button id="share-score" type="button">Share score</button>
        <button id="play-again" type="button">Play again</button>
      </div>
    </div>
  </main>

  <script type="module" src="game.js"></script>
</body>
</html>
